[package]
name = "alchemy-devtools"
version.workspace = true
edition.workspace = true

[dependencies]
png = { version = "0.17", optional = true }
regex = "1"
libc = "0.2"
walkdir = "2.5"
sha2 = "0.10"
tempfile = "3"
sha1 = "0.10"
lang-c = "=0.15.1"
gif = { version = "0.14", default-features = false, features = ["std"], optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
# `render`: the docs site's pictures and recordings, run in libmgba, and
# lit's PNG reading; README says how to build it.
render = ["dep:gif", "dep:cc", "dep:png"]

[[bin]]
name = "alchemy-devtools"
path = "src/main.rs"

[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = false
incremental = false
strip = true

[profile.dev]
debug = false
incremental = false
