[package]
name = "alchemy-devtools"
version.workspace = true
edition.workspace = true

[dependencies]
fdeflate = "0.3"
png = "0.17"
ags = { path = "ags" }
regex = "1"
libc = "0.2"
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf", "std"] }
walkdir = "2.5"
sha2 = "0.10"
tempfile = "3"
sha1 = "0.10"
lang-c = "=0.15.1"

[[bin]]
name = "alchemy-devtools"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["ags"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = false
incremental = false
strip = true

[profile.dev]
debug = false
incremental = false
